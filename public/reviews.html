<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920">
    <link rel="icon" type="image/x-icon" href="./assets/LogoPremium.png" />
    <title>SoundNest - Reseñas</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/reviews.css">
</head>
<body>
    <header id="top-bar" class="glass-panel">
        <a id="brand" href="index.html">
            <img src="assets/group-100.png" alt="Logo de SoundNest">
            <span id="user-plan">Free</span>
        </a>
        <div id="central-search">
            <a id="home-button" href="home-free.html">
                <img src="assets/home-page.png" width="37" alt="Inicio">
            </a>
            <div id="search-field">
                <img src="assets/search.png" width="35" alt="">
                <input id="search-input" name="busqueda" type="search" aria-label="Buscar">
                <img src="assets/document-in-folder.png" width="30" alt="">
            </div>
        </div>
        <div id="user-actions">
            <span id="user-avatar" aria-hidden="true">
                <img src="assets/ellipse-1.png" alt="">
            </span>
            <a id="logout" href="login.html" title="Cerrar sesión">
                <img src="assets/Logout Rounded.png" alt="Cerrar sesión">
            </a>
        </div>
    </header>
    <div id="left-column">
        <div id="current-song-panel" class="side-panel">
            <img src="assets/circled-play-button.png" alt="Reproducir">
        </div>
        <div id="playback-queue-panel" class="side-panel">
            <div class="queue-item">
                <span class="queue-item-cover"></span>
                <img src="assets/circled-play-button.png" alt="Reproducir">
            </div>
            <div class="queue-item">
                <span class="queue-item-cover"></span>
                <img src="assets/circled-play-button.png" alt="Reproducir">
            </div>
            <div class="queue-item">
                <span class="queue-item-cover"></span>
                <img src="assets/circled-play-button.png" alt="Reproducir">
            </div>
            <div class="queue-item">
                <span class="queue-item-cover"></span>
                <img src="assets/circled-play-button.png" alt="Reproducir">
            </div>
        </div>
    </div>
    <button id="tags-option" class="additional-option disabled-option" type="button" aria-haspopup="dialog" aria-controls="review-tags-dialog">
        <img src="assets/checkbox.svg" alt="">
        Agregar etiquetas
    </button>
    <label id="play-count-option" class="additional-option">
        <img src="assets/checkbox.svg" alt="">
        Agregar numero de reproducciones
    </label>
    <main id="review-panel" class="glass-panel">
        <div id="song-details">
            <p>Nombre de la canción</p>
            <p>Álbum</p>
            <p id="artist-name">Artista</p>
            <strong id="rating">4.9</strong>
        </div>
        <a id="add-to-playlist-button" href="#">
            <img src="assets/plus-math.png" alt="">
            Agregar a la playlist
        </a>
        <form id="review-form" method="post">
            <span id="review-cover"></span>
            <div id="review-content">
                <h2 id="review-title">Tu reseña</h2>
                <textarea name="resena" placeholder="Comparte tu opinión sobre esta canción...*" required></textarea>
            </div>
        </form>
        <button id="publish-review-button" type="submit" form="review-form">Publicar</button>
    </main>
        <dialog id="review-tags-dialog" aria-labelledby="review-tags-title">
            <div class="review-tags-content">
                <h2 id="review-tags-title">Agregar etiqueta</h2>
                <p>Escribe una etiqueta para acompañar tu reseña.</p>
                <label for="review-tag-input">Etiqueta</label>
                <input id="review-tag-input" type="text" maxlength="45" placeholder="Ej. Favorita" required>
                <div class="review-tags-actions">
                    <button id="remove-review-tag" type="button" hidden>Quitar etiqueta</button>
                    <button id="cancel-review-tag" type="button">Cancelar</button>
                    <button id="save-review-tag" type="button">Guardar</button>
                </div>
            </div>
        </dialog>
        <footer class="glass-panel player-bar" id="player">
        <div class="current-song" id="song-info">
            <span id="current-song-cover"></span>
            <div>
                Nombre<br>
                Artista - Álbum
            </div>
        </div>
        <div id="playback-controls">
            <nav id="playback-buttons">
                <img id="shuffle-button" src="assets/shuffle.png" alt="Aleatorio">
                <img id="previous-button" src="assets/end.png" alt="Anterior">
                <img id="play-button" src="assets/play-button.png" alt="Reproducir">
                <img id="next-button" src="assets/end-1.png" alt="Siguiente">
                <img id="repeat-button" src="assets/group-70.png" alt="Repetir">
            </nav>
            <input
                id="progress-control"
                type="range"
                min="0"
                max="253"
                value="4"
                style="--porcentaje-relleno: 1.6%"
                oninput="this.style.setProperty('--porcentaje-relleno', this.value / this.max * 100 + '%')">
            <div id="playback-times">
                <span id="current-time">0:04</span>
                <span id="remaining-time">-4:13</span>
            </div>
        </div>
        <div id="volume-controls">
            <img id="like-icon" src="assets/heart.png" alt="Me gusta">
            <img id="volume-icon" src="assets/speaker.png" alt="Volumen">
            <input
                id="volume-control"
                type="range"
                min="0"
                max="100"
                value="50"
                style="--porcentaje-relleno: 50%"
                oninput="this.style.setProperty('--porcentaje-relleno', this.value / this.max * 100 + '%')">
        </div>
    </footer>
    <script src="js/sql.js"></script>
    <script src="js/session-storage.js"></script>
    <script src="js/user-interface.js"></script>
    <script src="js/playlist-menu.js"></script>
    <script src="js/music-player.js"></script>
    <script src="js/song-reviews.js"></script>
</body>
</html>
