<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920" />
    <link rel="icon" type="image/x-icon" href="./assets/LogoPremium.png" />
    <title>SoundNest - Inicio de sesión</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/authentication.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <section id="form-card" class="glass-panel"></section>
    <img id="illustration-background" src="assets/upbar.png" alt="" />
    <img
      id="girl-illustration"
      src="assets/illustracion-1.png"
      alt="Chica con audífonos y patineta"
    />
    <form
      class="auth-form"
      id="login-form"
      action="home-free.html"
      method="post"
    >
      <img
        id="form-logo"
        src="assets/logo-blanco.png"
        alt="Logo de SoundNest"
      />
      <h1 id="form-title">¡Que bueno verte de nuevo!</h1>
      <label class="form-field">
        Correo Electrónico
        <input
          class="text-input"
          name="correo"
          type="email"
          autocomplete="email"
          required
        />
      </label>
      <label class="form-field">
        Contraseña
        <input
          class="text-input"
          name="contrasena"
          type="password"
          autocomplete="current-password"
          required
        />
      </label>
      <button id="submit-button" type="submit">Iniciar Sesión</button>
      <p id="help-text">¿Sin cuenta aún?</p>
      <a id="alternate-link" href="register.html">Registro</a>
    </form>
    <script src="js/sql.js"></script>
    <script src="js/session-storage.js"></script>
    <script src="js/user-interface.js"></script>
    <script src="js/authentication.js"></script>
  </body>
</html>
