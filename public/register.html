<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920" />
    <link rel="icon" type="image/x-icon" href="./assets/LogoPremium.png" />
    <title>SoundNest - Registro</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/authentication.css" />
    <link rel="stylesheet" href="css/register.css" />
  </head>
  <body>
    <section id="form-card" class="glass-panel"></section>
    <img id="illustration-background" src="assets/upbar.png" alt="" />
    <div id="astronaut-illustration-container">
      <img
        id="astronaut-illustration"
        src="assets/group-140.png"
        alt="Astronauta tocando guitarra"
      />
    </div>
    <form
      class="auth-form"
      id="signup-form"
      action="home-free.html"
      method="post"
    >
      <img
        id="form-logo"
        src="assets/logo-blanco.png"
        alt="Logo de SoundNest"
      />
      <h1 id="form-title">¡Empieza tu historia musical!</h1>
      <label class="form-field">
        Nombre de Usuario
        <input
          class="text-input"
          name="usuario"
          type="text"
          autocomplete="username"
          required
        />
      </label>
      <label class="form-field">
        Correo Electronico
        <input
          class="text-input"
          name="correo"
          type="email"
          autocomplete="email"
          required
        />
      </label>
      <label class="form-field">
        Crear Contraseña
        <input
          class="text-input"
          name="contrasena"
          type="password"
          autocomplete="new-password"
          minlength="10"
          required
        />
      </label>
      <div id="password-requirements">
        Contraseña debe tener
        <ul>
          <li>1 Letra mayúscula</li>
          <li>1 número o carácter especial</li>
          <li>10 carácteres mínimo</li>
        </ul>
      </div>
      <button id="submit-button" type="submit">Crear cuenta</button>
      <p id="help-text">¿Ya estas registrado?</p>
      <a id="alternate-link" href="login.html">Inicio de sesión</a>
    </form>
    <script src="js/sql.js"></script>
    <script src="js/session-storage.js"></script>
    <script src="js/user-interface.js"></script>
    <script src="js/authentication.js"></script>
  </body>
</html>
