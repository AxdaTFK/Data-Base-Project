<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920" />
    <title>SoundNest - Planes</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/plans.css" />
  </head>
  <body>
    <section id="plan-free" class="tarjeta-plan">
      <h2 class="nombre-plan">Free</h2>
      <p id="estado-free" class="estado-plan">(Actual)</p>
      <ul class="lista-beneficios">
        <li class="beneficio">
          <img class="icono-beneficio" src="assets/check-plan.svg" alt="" />
          <span>Número de canciones limitado por dia</span>
        </li>
        <li class="beneficio">
          <img class="icono-beneficio" src="assets/check-plan.svg" alt="" />
          <span>MÁS anuncios</span>
        </li>
        <li class="beneficio">
          <img class="icono-beneficio" src="assets/check-plan.svg" alt="" />
          <span>Saltos de canciones limitados</span>
        </li>
      </ul>
      <button class="boton-plan" type="button">Costo $0</button>
    </section>

    <section id="plan-premium" class="tarjeta-plan">
      <h2 class="nombre-plan">Premium</h2>
      <p id="estado-premium" class="estado-plan">(Recomendado)</p>
      <ul class="lista-beneficios">
        <li class="beneficio">
          <img class="icono-beneficio" src="assets/check-plan.svg" alt="" />
          <span>Sin limites de canciones por dia</span>
        </li>
        <li class="beneficio">
          <img class="icono-beneficio" src="assets/check-plan.svg" alt="" />
          <span>SIN anuncios</span>
        </li>
        <li class="beneficio">
          <img class="icono-beneficio" src="assets/check-plan.svg" alt="" />
          <span>Saltos de canciones ilimitados</span>
        </li>
      </ul>
      <button class="boton-plan" type="button">Costo $29.990</button>
      <p id="nota-terminos">
        Sujeta a los <em>Términos y Condiciones</em> del plan de SoundNest
      </p>
    </section>
  </body>
</html>
