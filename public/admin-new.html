<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920" />
    <link rel="icon" type="image/x-icon" href="./assets/LogoPremium.png" />
    <title>SoundNest - Añadir contenido</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="css/admin-new.css" />
  </head>
  <body>
    <nav id="sidebar-menu" class="glass-panel">
      <button id="admin-link" class="sidebar-menu-link" type="button">Administrador</button>
      <a class="sidebar-menu-link" href="admin-dashboard.html">
        <img src="assets/analytics.png" alt="" />
        Dashboard
      </a>
      <a class="sidebar-menu-link" href="admin-users.html">
        <img src="assets/user.png" alt="" />
        Usuarios
      </a>
      <a class="sidebar-menu-link" href="admin-subscriptions.html">
        <img src="assets/combo-chart.png" alt="" />
        Suscripciones
      </a>
      <img id="sidebar-logo" src="assets/logo.png" alt="SoundNest" />
      <a id="logout" href="login.html" title="Cerrar sesión">
        <img src="assets/Logout Rounded.png" alt="Cerrar sesión" />
      </a>
    </nav>
    <main id="content-panel" class="glass-panel">
      <h1 id="panel-title">Añadir Nuevo Contendio de Música</h1>
      <label id="upload-area">
        <input
          name="archivo-audio"
          type="file"
          accept="audio/*"
          form="content-form"
          hidden
        />
        <img src="assets/upward-arrow.png" alt="" />
        <span>Subir Archivo</span>
      </label>
      <label id="cover-preview">
        <input
          name="imagen-cancion"
          type="file"
          accept="image/*"
          form="content-form"
          hidden
        />
        <img src="assets/pencil.svg" alt="Editar portada" />
      </label>
      <form
       
        id="content-form"
        action="admin-confirmation.html"
        method="post"
      >
        <label>
          Nombre de la canción
          <input name="nombre-cancion" type="text" required />
        </label>
        <label>
          Artista
          <input name="artista" type="text" required />
        </label>
        <label>
          Álbum
          <input name="album" type="text" />
        </label>
        <label>
          Género
          <input name="genero" type="text" />
        </label>
        <label>
          Año de Lanzamiento
          <input name="anio-lanzamiento" type="number" min="1900" max="2100" />
        </label>
      </form>
      <button
        id="publish-content-button" class="blue-button"
        type="submit"
        form="content-form"
      >
        Publicar
      </button>
    </main>
    <script src="js/sql.js"></script>
    <script src="js/session-storage.js"></script>
    <script src="js/user-interface.js"></script>
    <script src="js/admin-panel.js"></script>
  </body>
</html>
